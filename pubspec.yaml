name: neurotrackerapp
description: "Minimal clinical symptom and wellness tracking for neurology patients."
publish_to: 'none'

version: 1.2.0+9

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.1
  flutter_local_notifications: ^22.0.1
  flutter_timezone: ^5.1.0
  timezone: ^0.11.1
  url_launcher: ^6.3.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/branding/neurosol_wordmark.png
