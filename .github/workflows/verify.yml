name: Verify

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Reject legacy shared mobile credentials
        run: |
          if rg -n 'NEUROTRACKER_API_KEY|x-api-key' lib; then
            echo "Legacy shared mobile credential reference found."
            exit 1
          fi
      - name: Verify clinic-managed Build 7 identity
        run: |
          rg -n '^version: 1\.0\.0\+7$' pubspec.yaml
          rg -n 'appBuildNumber = 7' lib/app_identity.dart
          rg -n 'clinic-managed-v1' lib/app_identity.dart
          if rg -n 'ProfileScreen|SymptomSelectionScreen|Edit patient profile' lib; then
            echo "Patient self-configuration remains reachable in source."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: node --check identity_store.js
      - run: node --check clinical_profiles.js
      - run: node --check disorder_catalog.js
      - run: npm test
      - name: Reject committed runtime clinical data
        working-directory: .
        run: |
          if git ls-files 'backend/data/*' | grep -q .; then
            echo "Runtime clinical data must not be tracked."
            exit 1
          fi

  windows-deployment-pack:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Parse deployment PowerShell
        shell: powershell
        run: |
          $Scripts = Get-ChildItem `
            .\delivery\build8-backend-compatibility\*.ps1
          foreach ($Script in $Scripts) {
            $Tokens = $null
            $Errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $Script.FullName,
              [ref]$Tokens,
              [ref]$Errors
            ) | Out-Null
            if ($Errors.Count -gt 0) {
              $Errors | Format-List
              throw "PowerShell parsing failed: $($Script.Name)"
            }
          }
      - name: Verify deployment data probe
        run: >-
          node --test
          delivery/build8-backend-compatibility/test/verify-clinical-data.test.js
      - name: Assemble offline deployment package
        shell: powershell
        run: |
          .\delivery\build8-backend-compatibility\New-Build8BackendDeploymentPack.ps1 `
            -SkipTests
          $Zip = Get-ChildItem .\delivery\release-packs\*.zip |
            Select-Object -First 1
          $Hash = Get-ChildItem .\delivery\release-packs\*.sha256.txt |
            Select-Object -First 1
          if (-not $Zip -or -not $Hash) {
            throw 'The offline backend deployment package was not created.'
          }
