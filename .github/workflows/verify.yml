name: Verify

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - name: Reject legacy shared mobile credentials
        run: |
          if rg -n 'NEUROTRACKER_API_KEY|x-api-key' lib; then
            echo "Legacy shared mobile credential reference found."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: node --check identity_store.js
      - run: npm test
      - name: Reject committed runtime clinical data
        working-directory: .
        run: |
          if git ls-files 'backend/data/*' | grep -q .; then
            echo "Runtime clinical data must not be tracked."
            exit 1
          fi
